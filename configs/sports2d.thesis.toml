# Example Sports2D configuration for the thesis 2D route.
# Edit a copy for each recording. Pose outputs remain in image pixel coordinates.

[base]
nb_persons_to_detect = 1
person_ordering_method = 'greatest_displacement'
first_person_height = 1.65
visible_side = ['right'] # set for the camera-facing side; use ['auto'] when uncertain
load_trc_px = ''
compare = false
time_range = []
input_size = [848, 480]
show_realtime_results = false
save_vid = false
save_img = false
save_pose = true
calculate_angles = true
save_angles = true

[pose]
slowmo_factor = 1.0
pose_model = 'body_with_feet'
mode = 'balanced'
det_frequency = 1
device = 'cpu'
backend = 'onnxruntime'
keypoint_likelihood_threshold = 0.30
average_likelihood_threshold = 0.40
keypoint_number_threshold = 0.60
tracking_mode = 'deepsort'
deepsort_params = """{'max_age':30, 'n_init':3, 'nms_max_overlap':0.8, 'max_cosine_distance':0.3, 'nn_budget':200, 'max_iou_distance':0.8, 'embedder_gpu': False, 'embedder':'mobilenet'}"""

[post-processing]
# Sports2D may process its native 2D products before common DLT reconstruction.
interpolate = true
interp_gap_smaller_than = 6
fill_large_gaps_with = 'nan'
sections_to_keep = 'largest'
reject_outliers = true
filter = false
show_graphs = false
save_graphs = false

[px_to_meters_conversion]
# The package uses two-view DLT for the thesis reconstruction route.
to_meters = false
make_c3d = false
save_calib = false
